volumes:
  mongodb-data-7: {}
  redis-data: {}

services:
  ui:
    image: ${CENIT_UI_IMAGE:-ghcr.io/cenit-io/ui:latest}
    ports:
      - "${UI_PORT:-3002}:80"
    environment:
      - REACT_APP_USE_ENVIRONMENT_CONFIG=true
      - REACT_APP_TIMEOUT_SPAN=300000
      - REACT_APP_APP_ID=admin
      - REACT_APP_LOCALHOST=http://localhost:${UI_PORT:-3002}
      - REACT_APP_CENIT_HOST=http://localhost:${SERVER_PORT:-3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    image: ${CENIT_SERVER_IMAGE:-ghcr.io/cenit-io/cenit:latest}
    ports:
      - "${SERVER_PORT:-3000}:8080"
    environment:
      - MONGODB_URI=mongodb://mongo_server/cenit
      - REDIS_HOST=redis
      - HOMEPAGE=http://localhost:${SERVER_PORT:-3000}
      - CENIT_UI=http://localhost:${UI_PORT:-3002}
      - RABBITMQ_BIGWIG_TX_URL=amqp://cenit_rabbit:cenit_rabbit@rabbitmq/cenit_rabbit_vhost
      - SCHEDULER_LOOKUP_INTERVAL=8
      - UNICORN_WORKERS=${CENIT_UNICORN_WORKERS:-2}
      - MAXIMUM_UNICORN_CONSUMERS=${CENIT_MAXIMUM_UNICORN_CONSUMERS:-2}
    depends_on:
      mongo_server:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/users/sign_in >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_PASS=cenit_rabbit
      - RABBITMQ_DEFAULT_USER=cenit_rabbit
      - RABBITMQ_DEFAULT_VHOST=cenit_rabbit_vhost
    labels:
      NAME: "rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo_server:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data-7:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
